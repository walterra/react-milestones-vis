name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Upgrade npm for OIDC support
        run: npm install --global npm@11

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Verify release
        run: |
          yarn check:all
          yarn test:supported
          yarn build
          yarn build-storybook

      - name: Determine release title
        id: release-version
        run: |
          yarn changeset status --output=release.json 2>/dev/null || true
          if [ -f release.json ]; then
            VERSION=$(jq -r '.releases[0].newVersion // empty' release.json)
            rm release.json
          fi
          if [ -n "$VERSION" ]; then
            echo "title=release v$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "title=chore: release" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release pull request or publish
        id: changesets
        uses: changesets/action@v1
        with:
          title: ${{ steps.release-version.outputs.title }}
          publish: yarn release
          createGithubReleases: true
          version: yarn version-packages
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Deploy Storybook to GitHub Pages
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          yarn build-storybook
          yarn deploy-storybook --repo "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
