name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    environment: ci

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run type checking
        run: yarn typecheck

      - name: Run linting
        run: yarn lint

      - name: Run tests (all supported React versions)
        run: yarn test:supported

      - name: Build package
        run: yarn build

      - name: Build Storybook
        run: yarn build-storybook

      - name: Run visual tests
        if: github.actor != 'dependabot[bot]'
        env:
          HTML2IMG_RENDER_URL: ${{ secrets.HTML2IMG_RENDER_URL }}
          HTML2IMG_API_KEY: ${{ secrets.HTML2IMG_API_KEY }}
        run: yarn test:visual

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: |
            coverage/
            src/components/milestones/__visual_tests__/__image_snapshots__/__diff_output__/
          retention-days: 30
